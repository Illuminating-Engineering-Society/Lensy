<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>My Bookmarks — IES Lens</title>
  <!-- The page moved to /bookmarks (client DO109). This stub exists for the
       share links already in circulation: a collection link is emailed as
       /projects.html?share=<token>, so the QUERY STRING must survive the
       redirect or the recipient lands on an empty bookmarks page. The
       meta-refresh is the no-JS fallback and deliberately drops it — there is
       nothing better it can do. -->
  <script>location.replace('/bookmarks' + location.search + location.hash);</script>
  <meta http-equiv="refresh" content="0;url=/bookmarks">
</head>
<body>
  <p><a href="/bookmarks">My Bookmarks has moved →</a></p>
</body>
</html>
