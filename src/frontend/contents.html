<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Standards — IES Lighting Library | Lensy</title>
  <!-- SSO gate: same authorization as the search page. -->
  <script src="/utils/auth-gate.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Brand tokens — kept in sync with index.html (no shared build step yet).
    tailwind.config = {
      theme: { extend: { colors: {
        'brand-primary': '#D95D2B', 'brand-primary-dark': '#B84A20',
        'brand-secondary': '#3A5068', 'brand-secondary-dark': '#2C3D4F',
        'brand-accent': '#EFA723', 'surface': '#F7F7F7', 'ink': '#2C2C2C',
        'ies-blue': '#D95D2B', 'ies-blue-dark': '#B84A20',
      }, fontFamily: {
        display: ['Nohemi', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
      } } }
    }
  </script>
  <style>
    @font-face { font-family: 'Nohemi'; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/Nohemi-Variable.woff2') format('woff2'); }
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/Inter-Variable.woff2') format('woff2'); }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #2C2C2C; }
    h1, h2, h3 { font-family: 'Nohemi', 'Inter', -apple-system, sans-serif; }
    .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: sk 1.4s infinite; }
    @keyframes sk { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body class="bg-surface min-h-screen text-ink">

  <!-- Gold banner, matching the search page (client wireframes, 2026-08-20). -->
  <header class="text-white shadow-md sticky top-0 z-40" style="background-color: #EFA723;">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5" title="Lensy — IES Assistant">
        <div class="w-10 h-10 rounded bg-white/25 flex items-center justify-center">
          <span class="font-display font-extrabold text-lg tracking-tight">IES</span>
        </div>
        <span class="font-display text-lg font-bold tracking-tight">Lensy</span>
      </a>
      <a href="/" class="text-sm px-3 py-1.5 rounded-md text-white/90 hover:text-white hover:bg-white/15 transition">← Back to search</a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="mb-6">
      <!-- "List Standards" — formerly "Table of Contents" (client wireframes,
           2026-08-20: the header nav item was renamed, so the page follows). -->
      <h1 class="text-2xl font-bold text-gray-900">List Standards</h1>
      <p class="text-sm text-gray-500 mt-1">
        Every current IES standard in the Lighting Library. Only the current edition of each
        standard is listed.
      </p>
      <p id="toc-metadata-notice" class="hidden text-xs text-amber-700 mt-2"></p>
    </div>

    <div class="mb-5 flex flex-wrap gap-3 items-center">
      <input type="text" id="toc-filter" placeholder="Filter by designation or title…"
        class="flex-1 min-w-[240px] px-4 py-2.5 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-ies-blue focus:border-transparent"/>
      <p class="text-sm text-gray-400" id="toc-count"></p>
    </div>

    <div id="toc-loading" class="space-y-2">
      <div class="skeleton h-14 rounded-lg"></div>
      <div class="skeleton h-14 rounded-lg"></div>
      <div class="skeleton h-14 rounded-lg"></div>
    </div>

    <div id="toc-groups" class="hidden space-y-8"></div>

    <p id="toc-error" class="hidden text-sm text-red-600"></p>
    <p id="toc-empty" class="hidden text-sm text-gray-400">No standards match that filter.</p>
  </main>

  <footer class="text-center text-xs text-gray-400 py-8 mt-8 border-t border-gray-100">
    <p class="font-medium text-gray-500">Lensy — IES Standards Search Assistant</p>
    <p class="mt-2 text-gray-300">Always refer to the full IES Standard for authoritative guidance.</p>
  </footer>

  <script>
    // ── Grouping (client DO35, refined by DO46) ──────────────────────────────
    //
    // Two levels of grouping, then one sort:
    //
    //   1. AUTHORING COMMITTEE — from Vitrium's Author metadata, printed as
    //      "IES [author]", sorted alphabetically and hyperlinked to its public
    //      committee page.
    //   2. Standards inside each committee, alphanumerically by designation
    //      ("RP-2" before "RP-10"), with the full title and the content
    //      description.
    //
    // The webstore Category level is GONE (client, 2026-08-20: "no longer group
    // by collection/type. Just group by Committee name (alphabetical) then sort
    // alphanumeric by designation") — a reader looking for a standard knows who
    // wrote it far more often than which product bundle it ships in. Standards
    // whose committee the export has not supplied are collected under one
    // honest heading rather than left looking mis-filed.

    let allStandards = [];

    // Sort within a series by document number, then edition — "RP-2" before
    // "RP-10", which a plain string sort gets wrong.
    function compareIds(a, b) {
      const parse = (id) => {
        const m = /^([A-Z]+)-(\d+)(?:\.(\d+))?-?(\d{2})?/.exec(String(id).toUpperCase());
        return m ? [m[1], Number(m[2]), Number(m[3] || 0), Number(m[4] || 0)] : [String(id), 0, 0, 0];
      };
      const [pa, na, sa, ea] = parse(a.id);
      const [pb, nb, sb, eb] = parse(b.id);
      return pa.localeCompare(pb) || na - nb || sa - sb || ea - eb;
    }

    async function loadContents() {
      try {
        const res = await fetch('/api/standards');
        if (!res.ok) throw new Error(`Could not load the library (HTTP ${res.status}).`);
        const data = await res.json();
        allStandards = (data.standards || []).filter(s => s && s.id);
        render();
      } catch (err) {
        document.getElementById('toc-loading').classList.add('hidden');
        const el = document.getElementById('toc-error');
        el.textContent = err.message;
        el.classList.remove('hidden');
      }
    }

    /** The committee credit line for one standard: "IES [author]" (DO46). */
    function authorLabelFor(s) {
      if (s.committee?.name) return s.committee.name;
      const author = String(s.author || '').trim();
      if (!author) return null;
      return /^ies\b/i.test(author) ? author : `IES ${author}`;
    }

    /** Standards inside an author group sort alphabetically by designation. */
    function compareForToc(a, b) {
      return compareIds(a, b);
    }

    function render() {
      const q = document.getElementById('toc-filter').value.trim().toLowerCase();
      const matches = allStandards.filter(s =>
        !q || String(s.id).toLowerCase().includes(q) ||
        String(s.title || '').toLowerCase().includes(q) ||
        String(s.full_designation || '').toLowerCase().includes(q) ||
        String(s.collection || '').toLowerCase().includes(q) ||
        String(s.committee?.name || s.author || '').toLowerCase().includes(q)
      );

      document.getElementById('toc-loading').classList.add('hidden');
      document.getElementById('toc-count').textContent =
        `${matches.length} of ${allStandards.length} standard${allStandards.length === 1 ? '' : 's'}`;
      document.getElementById('toc-empty').classList.toggle('hidden', matches.length > 0);

      // Say plainly when the metadata this page is built on has not arrived —
      // an ungrouped list looks like a bug otherwise. Descriptions come from the
      // same Vitrium/webstore export as the committee attribution.
      const notice = document.getElementById('toc-metadata-notice');
      const withAuthor = allStandards.filter(s => authorLabelFor(s)).length;
      const withDescription = allStandards.filter(s => s.description).length;
      if (withAuthor === 0 && allStandards.length > 0) {
        notice.textContent = 'The Vitrium/webstore export has not supplied the Author (authoring committee) metadata yet, '
          + 'so every standard is listed together. Grouping by committee resumes automatically once it does.';
        notice.classList.remove('hidden');
      } else if (withDescription === 0 && allStandards.length > 0) {
        notice.textContent = 'Grouped by authoring committee. The export has not supplied the content descriptions yet, '
          + 'so each standard shows its designation and title only.';
        notice.classList.remove('hidden');
      } else {
        notice.classList.add('hidden');
      }

      // ONE level of grouping: the authoring committee (client, 2026-08-20:
      // "no longer group by collection/type. Just group by Committee name
      // (alphabetical) then sort alphanumeric by designation"). The webstore
      // Category grouping is gone — a reader looking for a standard knows who
      // wrote it far more often than which product bundle it ships in.
      const wrap = document.getElementById('toc-groups');
      wrap.innerHTML = renderCommitteeGroups(matches);
      wrap.classList.remove('hidden');
    }

    /**
     * The only grouping: by authoring committee, alphabetically, with the
     * committee name hyperlinked to its public page (client DO46, promoted to
     * the sole grouping level 2026-08-20). Standards inside a committee sort
     * alphanumerically by designation.
     *
     * Standards whose Author metadata has not been supplied yet are collected
     * under one honest heading rather than under an invented committee.
     */
    function renderCommitteeGroups(standards) {
      const byAuthor = new Map();
      for (const s of standards) {
        const label = authorLabelFor(s) || '';
        if (!byAuthor.has(label)) byAuthor.set(label, []);
        byAuthor.get(label).push(s);
      }

      const named = [...byAuthor.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b));
      const order = byAuthor.has('') ? [...named, ''] : named;

      return order.map(label => {
        const rows = byAuthor.get(label).sort(compareForToc);
        // The link is resolved server-side (same function the result cards use),
        // so a committee IES no longer publishes falls back to the root list
        // rather than to a 404.
        const committee = rows.find(s => s.committee)?.committee;
        const heading = label
          ? (committee
              ? `<a href="${escapeHtml(committee.url)}" target="_blank" rel="noopener"
                     class="hover:text-ies-blue hover:underline"
                     title="${escapeHtml(committee.exact
                       ? 'View this committee’s roster on ies.org'
                       : 'This committee has no current page — opens the list of IES technical committees')}"
                  >${escapeHtml(label)}${committee.exact ? '' : ' ↗'}</a>`
              : escapeHtml(label))
          : '<span class="text-gray-400 font-normal">Authoring committee not yet supplied</span>';

        return `
          <section class="mb-6">
            <h2 class="text-sm font-bold text-gray-700 mb-1.5">${heading}</h2>
            <div class="bg-white rounded-xl border border-gray-100 divide-y divide-gray-100 overflow-hidden">
              ${rows.map(row).join('')}
            </div>
          </section>`;
      }).join('');
    }

    // One standard, laid out as the client's mockup: thumbnail | designation,
    // full title, Vitrium content description | eLearning links | Read / Buy.
    // The authoring committee is the group heading above (DO46). Every optional
    // field is omitted rather than rendered blank.
    function row(s) {
      const designation = s.full_designation || `ANSI/IES ${s.id}`;
      const title = (s.title && s.title !== s.id) ? s.title : '';

      const thumb = s.thumbnail_url
        ? `<img src="${escapeHtml(s.thumbnail_url)}" alt="Cover of ${escapeHtml(s.id)}"
               class="w-14 h-auto rounded border border-gray-200 shrink-0" loading="lazy"/>`
        : `<div class="w-14 h-[72px] rounded border border-dashed border-gray-200 shrink-0 flex items-center justify-center">
             <span class="text-[9px] text-gray-300 text-center leading-tight px-1">No cover</span>
           </div>`;

      // The authoring committee is the GROUP HEADING now (client DO46), so it is
      // no longer repeated on every row inside its own group.
      const elearning = (s.elearning || []).length
        ? `<div class="min-w-0 sm:w-56 shrink-0">
             <p class="text-[10px] uppercase tracking-wide text-gray-400 mb-1">eLearning</p>
             <ul class="space-y-0.5">
               ${s.elearning.map(e => `
                 <li class="text-[11px] leading-snug">
                   <a href="${escapeHtml(e.url)}" target="_blank" rel="noopener"
                      class="text-ies-blue hover:underline">${escapeHtml(e.title)}</a>
                 </li>`).join('')}
             </ul>
           </div>`
        : '';

      // "Keep to 'Open in Library'" (client, 2026-08-20) — the button now says
      // where it goes rather than what to do when you get there.
      const read = s.vitrium_web_url
        ? `<a href="${escapeHtml(s.vitrium_web_url)}" target="_blank" rel="noopener"
             class="text-xs px-2.5 py-1 bg-brand-primary text-white rounded-lg hover:bg-brand-primary-dark transition font-medium whitespace-nowrap text-center"
             title="Open ${escapeHtml(s.id)} in the IES Lighting Library">Open in Library</a>`
        : `<span class="text-xs text-gray-300 whitespace-nowrap text-center" title="No Lighting Library URL synced for this standard yet">Not linked</span>`;
      const buy = s.buy_url
        ? `<a href="${escapeHtml(s.buy_url)}" target="_blank" rel="noopener"
             class="text-xs px-2.5 py-1 border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-50 transition font-medium whitespace-nowrap text-center">Buy</a>`
        : '';

      // The per-row "Search" button is gone (client, 2026-08-20) — this page is
      // a catalogue of the library, and searching a single standard from it was
      // a second, weaker way into a search box that is one click away.
      // "## pages indexed" is gone with it: an ingest statistic, not a fact
      // about the standard.
      return `
        <div class="px-4 py-3 flex flex-wrap sm:flex-nowrap items-start gap-4 hover:bg-gray-50 transition">
          ${thumb}
          <div class="min-w-0 flex-1">
            <p class="text-sm font-semibold text-gray-900">${escapeHtml(designation)}</p>
            ${title ? `<p class="text-xs text-gray-600">${escapeHtml(title)}</p>` : ''}
            ${s.description ? `<p class="text-xs text-gray-500 mt-1 leading-relaxed">${escapeHtml(s.description)}</p>` : ''}
          </div>
          ${elearning}
          <div class="flex sm:flex-col items-stretch gap-1.5 shrink-0">
            ${read}${buy}
          </div>
        </div>`;
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    document.getElementById('toc-filter').addEventListener('input', render);
    loadContents();
  </script>
</body>
</html>
