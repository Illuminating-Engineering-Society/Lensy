# Lensy - IES AI-Powered Standards Assistant
# Cloudflare Workers Configuration
#
# Before deploying, run these commands to create resources and fill in the IDs below:
#
#   wrangler r2 bucket create ies-standards-pdfs
#   wrangler d1 create ies-metadata          → copy database_id below
#   wrangler vectorize create ies-standards-vectors --dimensions=768 --metric=cosine
#   wrangler vectorize create ies-standards-deprecated-vectors --dimensions=768 --metric=cosine
#   wrangler kv namespace create ies-sessions  → copy id below
#
# Metadata indexes (required for filtered Vectorize queries — filters only
# apply to vectors inserted AFTER the index exists, so create these before
# ingesting; re-ingest afterwards if they were added later):
#   wrangler vectorize create-metadata-index ies-standards-vectors --property-name=standard_code --type=string
#   wrangler vectorize create-metadata-index ies-standards-vectors --property-name=chunk_type --type=string
#     (chunk_type powers the References-only AND Definitions-only search modes;
#      without it those scoped queries fall back to the shared top-K pool, and
#      Definitions falls back to the D1 exact-term match — see searchDefinitions)
#
# Then set secrets (do NOT commit real keys):
#   wrangler secret put LUCIUS_API_SECRET    ← REQUIRED before production deploy:
#                                              ingest + admin endpoints fail closed
#                                              without it when ENVIRONMENT=production
#   wrangler secret put VITRIUM_API_KEY
#   wrangler secret put SHAREPOINT_TOKEN
#
# SSO against auth.ies.org (AuthIES) — Lensy is a COOKIE Service Provider and
# verifies the shared ies_auth cookie. BOTH secrets must be the SAME values as
# the AuthIES Worker's (they decrypt/verify the cookie it mints):
#   wrangler secret put SESSION_ENCRYPTION_KEY
#   wrangler secret put COOKIE_SIGNING_SECRET
# Without them /api/auth/me answers 503 sso_misconfigured and the gate says so
# outright — it does NOT loop through login (staff bearer still works). Same
# answer if either secret is rotated on only one side: rotate both together.
#
# STAGING: lensy-staging.ies.org is a SECOND custom domain on this SAME Worker
# (no [env.staging] block — it would need its own D1/R2/KV/Vectorize; wrangler
# does not inherit bindings into named environments). The code detects the
# hostname (src/lib/sso.ts): requests arriving via lensy-staging.ies.org do
# login/logout against auth-staging.ies.org instead of auth.ies.org — each
# IdP's `lensy` SP allowlist admits only its own Lensy origin (AuthIES
# scripts/seed-sps.ts), so this is what keeps the redirect from being rejected.
# Everything else (corpus, invite list, behavior) is deliberately identical.
#
# AuthIES secrets are PER-ENVIRONMENT. If auth-staging's pair differs from
# production's, also set:
#   wrangler secret put SESSION_ENCRYPTION_KEY_STAGING
#   wrangler secret put COOKIE_SIGNING_SECRET_STAGING
# Unset, staging-host requests verify ies_auth with the shared pair above —
# correct only if both IdPs were seeded with the same values.

name = "lensy"
main = "src/workers/api.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ─── R2: PDF Storage ──────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "PDFS"
bucket_name = "ies-standards-pdfs"

# ─── D1: Structured Data (Applications, Projects) ────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "ies-metadata"
database_id = "79936b28-a632-487d-89ee-4e57af330ecd"

# ─── Vectorize: Semantic Search Index ────────────────────────────────────────
[[vectorize]]
binding = "VECTORIZE"
index_name = "ies-standards-vectors"

# Deprecated standards live in a SEPARATE index: they are only queried for
# version-comparison searches ("what's new in RP-6?"), never crowd the main
# index's topK pool, and are structurally unreachable from any future
# external API (which only ever gets the main index).
[[vectorize]]
binding = "VECTORIZE_DEPRECATED"
index_name = "ies-standards-deprecated-vectors"

# ─── KV: Session & Cache ─────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "SESSIONS"
id = "42532fedadc54caf899f190ec3d7eea7"

# ─── Email Sending: invitation mail ──────────────────────────────────────────
# Native Cloudflare Email Service binding (no third-party API, no API key).
#
# REQUIRES lensy.ies.org to be onboarded onto Email Sending first (Cloudflare
# dashboard → Email Service → Email Sending → add domain; it publishes the
# SPF/DKIM/DMARC records for the SUBDOMAIN only). Until that is done every send
# throws E_SENDER_NOT_VERIFIED — invites are still created, and the dashboard
# shows the reason per row (src/lib/email.ts fails soft by design).
#
# Deliberately a subdomain sender: the ies.org apex is Microsoft 365 with a
# strict `-all` SPF record, and onboarding the apex would add a second SPF
# record and break mail for the whole organization. Same reasoning as AuthIES,
# which sends from noreply@auth.ies.org.
#
# NOTE: `allowed_sender_addresses` (which would pin the From so a bug elsewhere
# in the Worker could not send as anyone else) is NOT set: wrangler 3.114 does
# not recognise the field — it warns "Unexpected fields" and leaves the binding
# unrestricted anyway. Add it when this repo moves to wrangler 4.x; until then
# the single sender is enforced in code (src/lib/email.ts FROM_ADDRESS).
[[send_email]]
name = "SEND_EMAIL"

# ─── Workers AI: Embeddings + AI Summaries ───────────────────────────────────
[ai]
binding = "AI"

# ─── Rate Limiting: /api/search (Workers Rate Limiting API) ──────────────────
# Protects the Workers AI budget from abusive clients. Keyed by client IP;
# 60 searches/min is far above any human usage. The Worker fails OPEN if the
# binding is missing or errors, so removing this block only removes the limit.
[[unsafe.bindings]]
name = "SEARCH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# ─── Environment Variables (non-secret) ──────────────────────────────────────
[vars]
VITRIUM_API_URL = "https://api.vitrium.com"
# Viewer links are NOT constructed from a base URL: Vitrium's web viewer uses
# opaque short-code URLs (https://view.protectedpdf.com/XXXXXX) stored per
# standard in D1 (standards.vitrium_web_url), populated by
# scripts/sync-metadata.js --csv from Vitrium's document export.
ENVIRONMENT = "production"
# IES Auth IDP (AuthIES Worker) — where /login and /logout redirect and where
# the ies_auth cookie comes from. It serves its own first-party login form and
# verifies credentials against its own D1; Lensy never sees credentials, only
# the resulting cookie. (No Wicket CAS hand-off exists any more.)
AUTH_IDP_BASE_URL = "https://auth.ies.org"
# "false" → ONLY emails in invited_users may enter. Default (anything else):
# IES members (isMember in the cookie) get in without an invite; the
# invited_users allowlist adds guests and can still revoke anyone.
ALLOW_MEMBERS_WITHOUT_INVITE = "true"
# LensyLite (client DO53). "on" → IES members WITHOUT a Lighting Library
# subscription get the limited tier: the Lighting Science collection only, with
# Illuminance Tables, the AI Guide and Document Comparison locked.
#
# ON since 2026-08-12. It was off because the subscription entitlement did not
# exist in the cookie; it does now. Wicket files Lighting Library purchases as
# person memberships with membership_category='subscription', and the AuthIES
# import writes them into roles_json as slugs, which ride the ies_auth cookie.
#
# Turning it on took ACCESS FROM NOBODY. Measured on production the same day:
# the 5 rows in invited_users are all role 'admin'/'staff' (both in
# FULL_ACCESS_INVITE_ROLES → full), and the only 4 accounts that have ever set a
# password are those same admins, all 4 also holding lighting-library-full-access.
# Everyone else is still 'pending' at the IdP and cannot sign in at all — so this
# sets the policy BEFORE the population arrives rather than revoking anything.
#
# Leaving it off was the actual risk: with is_member now populated for 7,986
# people and ALLOW_MEMBERS_WITHOUT_INVITE true, every member who activates would
# otherwise land on FULL Lensy — the whole Library, for the 7,440 of them who
# never bought it.
LENSY_LITE = "on"
# Comma-separated IdP role slugs that mean "has a Lighting Library subscription".
# Unset → the defaults in src/lib/tiers.ts, none of which Wicket actually emits.
#
# This is the slugified Wicket membership tier name, and deliberately ONLY that
# one: it is the tier that grants the whole Library (546 people). The narrower
# products are NOT full access and are not listed — the per-collection
# subscriptions (Practice / Applications / Roadway / Testing & Measurements) and
# "The Illuminance Selector" (205 people). See the note in src/lib/tiers.ts:
# what those cohorts should get is an open product question.
LENSY_SUBSCRIBER_ROLES = "lighting-library-full-access"

# Secrets set via `wrangler secret put`:
# VITRIUM_API_KEY
# SHAREPOINT_TOKEN
# SESSION_ENCRYPTION_KEY           (same value as AuthIES production)
# COOKIE_SIGNING_SECRET            (same value as AuthIES production)
# SESSION_ENCRYPTION_KEY_STAGING   (optional — same value as AuthIES staging;
# COOKIE_SIGNING_SECRET_STAGING     only needed if staging's pair differs)

# ─── Routes / Custom Domain ───────────────────────────────────────────────────
# Serves the Worker at lensy.ies.org instead of the default *.workers.dev URL.
#
# REQUIRES the ies.org DNS zone (or a delegated lensy.ies.org zone) to already
# be present in this Cloudflare account — that's a manual step, done once, via
# either:
#   (a) the "Domains" tab on this Worker in the dashboard → Add Custom Domain, or
#   (b) letting this route provision automatically on `wrangler deploy` /
#       Workers Builds, IF the zone is already in the account.
# If the zone is NOT in this account yet, deploy will fail with a clear error
# naming the missing zone — that's expected until IES's DNS is added/delegated
# here. Removing this block does not affect the *.workers.dev URL.
[[routes]]
pattern = "lensy.ies.org"
custom_domain = true

[triggers]
crons = []  # Add scheduled tasks here if needed

# ─── Development ──────────────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

[assets]
directory = "src/frontend"
